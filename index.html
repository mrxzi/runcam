<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="RunCam — Perekam video berbasis browser dengan live overlay statistik GPS ala Strava." />
  <meta name="theme-color" content="#000000" />
  <title>RunCam — Strava-Style Video Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ══════════ MAIN APP ══════════ -->
  <div id="app" class="app">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="mainCanvas"></canvas>

    <!-- Top-right buttons -->
    <div class="top-buttons">
      <button id="btnTheme" class="btn-icon" title="Ganti Tema" aria-label="Ganti Tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="22" y2="12"/>
        </svg>
      </button>
      <button id="btnSwitchCam" class="btn-icon" title="Ganti Kamera" aria-label="Ganti Kamera">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5l2-3h6l2 3h1a2 2 0 0 1 2 2v4"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M17 22v-6"/><path d="M14 19l3-3 3 3"/>
        </svg>
      </button>
    </div>

    <!-- ══════════ THEME PICKER PANEL ══════════ -->
    <div id="themePanel" class="theme-panel hidden">
      <div class="theme-panel-header">
        <span>Pilih Tema Overlay</span>
        <button id="btnCloseTheme" class="theme-close">&times;</button>
      </div>
      <div class="theme-list" id="themeList">
        <!-- Themes injected by JS -->
      </div>
    </div>

    <!-- ══════════ LENS PICKER ══════════ -->
    <div id="lensPicker" class="lens-picker">
      <button class="lens-btn active" data-lens="0.5">0.5×</button>
      <button class="lens-btn" data-lens="1">1×</button>
      <button class="lens-btn" data-lens="2">2×</button>
    </div>

    <!-- ══════════ CONTROL BAR ══════════ -->
    <div id="controlBar" class="control-bar">
      <button id="btnStart" class="btn-rec" title="Mulai Rekam">
        <span class="btn-rec-circle"></span>
      </button>
      <button id="btnPause" class="btn-ctrl btn-pause hidden" title="Jeda">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
      </button>
      <button id="btnResume" class="btn-ctrl btn-resume hidden" title="Lanjut">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6,4 20,12 6,20"/>
        </svg>
      </button>
      <button id="btnStop" class="btn-ctrl btn-stop hidden" title="Stop & Simpan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ══════════ PREVIEW MODAL ══════════ -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 class="modal-title">Rekaman Selesai!</h2>
      <div class="modal-video-wrap">
        <video id="previewVideo" controls></video>
      </div>
      <div class="modal-stats" id="modalStats"></div>
      <div class="modal-actions">
        <button id="btnDownload" class="btn-action btn-download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Video
        </button>
        <button id="btnNewRecording" class="btn-action btn-new">Rekam Baru</button>
      </div>
    </div>
  </div>

  <!-- ══════════ SPLASH SCREEN ══════════ -->
  <div id="splashScreen" class="splash">
    <div class="splash-inner">
      <div class="splash-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </div>
      <h1 class="splash-title">RunCam</h1>
      <p class="splash-sub">Video Recorder with GPS Overlay</p>
      <button id="btnGrant" class="btn-grant">
        <span class="btn-grant-text">Mulai</span>
        <span class="btn-grant-loader hidden">
          <span class="spinner"></span>
        </span>
      </button>
      <p class="splash-note">Membutuhkan akses kamera, mikrofon, dan GPS</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
